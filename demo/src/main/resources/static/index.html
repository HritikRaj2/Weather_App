<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <style>
        :root {
          --card-height: 300px;
          --card-width: calc(var(--card-height) / 1.5);
        }

        * {
          box-sizing: border-box;
        }

        body {
          width: 100vw;
          height: 100vh;
          margin: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          background: #191c29;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
          color: red;
          font-size: 3rem;
          text-shadow: 2px 2px 4px white;
          margin-top: 40px;
          margin-bottom: 10px;
        }

        #result {
          background: rgba(255, 255, 255, 0.1);
          color: #fff;
          font-size: 1.2rem;
          font-family: 'Courier New', Courier, monospace;
          padding: 15px 25px;
          border-radius: 15px;
          backdrop-filter: blur(10px);
          box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
          margin-bottom: 30px;
        }

        input[type="text"] {
          padding: 10px;
          border-radius: 10px;
          border: none;
          margin-top: 20px;
          font-size: 1rem;
        }

        button {
          padding: 10px 20px;
          margin-left: 10px;
          border-radius: 10px;
          border: none;
          background-color: crimson;
          color: white;
          cursor: pointer;
          font-weight: bold;
          font-size: 1rem;
        }

        button:hover {
          background-color: darkred;
        }

        .card-container {
          display: flex;
          justify-content: center;
          gap: 40px;
          flex-wrap: wrap;
          margin-top: 30px;
        }

        .card {
          width: var(--card-width);
          height: var(--card-height);
          position: relative;
          display: flex;
          justify-content: center;
          align-items: flex-end;
          padding: 0 36px;
          perspective: 2500px;
          margin: 0 10px;
        }

        .cover-image {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }

        .wrapper {
          transition: all 0.5s;
          position: absolute;
          width: 100%;
          z-index: -1;
        }

        .card:hover .wrapper {
          transform: perspective(900px) translateY(-5%) rotateX(25deg) translateZ(0);
          box-shadow: 2px 35px 32px -8px rgba(0, 0, 0, 0.75);
        }

        .wrapper::before,
        .wrapper::after {
          content: "";
          opacity: 0;
          width: 100%;
          height: 80px;
          transition: all 0.5s;
          position: absolute;
          left: 0;
        }

        .wrapper::before {
          top: 0;
          height: 100%;
          background-image: linear-gradient(
            to top,
            transparent 46%,
            rgba(12, 13, 19, 0.5) 68%,
            rgba(12, 13, 19) 97%
          );
        }

        .wrapper::after {
          bottom: 0;
          opacity: 1;
          background-image: linear-gradient(
            to bottom,
            transparent 46%,
            rgba(12, 13, 19, 0.5) 68%,
            rgba(12, 13, 19) 97%
          );
        }

        .card:hover .wrapper::before,
        .card:hover .wrapper::after {
          opacity: 1;
        }

        .card:hover .wrapper::after {
          height: 120px;
        }

        .title {
          width: 100%;
          transition: transform 0.5s;
        }

        .card:hover .title {
          transform: translate3d(0%, -50px, 100px);
        }

        .character {
          width: 100%;
          opacity: 0;
          transition: all 0.5s;
          position: absolute;
          z-index: -1;
        }

        .card:hover .character {
          opacity: 1;
          transform: translate3d(0%, -30%, 100px);
        }
    </style>
</head>
<body>

<h1>Weather App</h1>
<input type="text" id="cityInput" placeholder="Enter city">
<br>
<button onclick="getWeather()">Get Weather</button>
<h3 id="result"></h3>

<div class="card-container">
    <a href="https://www.mythrillfiction.com/the-dark-rider" target="_blank">
        <div class="card">
            <div class="wrapper">
                <img src="https://ggayane.github.io/css-experiments/cards/dark_rider-cover.jpg" class="cover-image" />
            </div>
            <img src="https://ggayane.github.io/css-experiments/cards/dark_rider-title.png" class="title" />
            <img src="https://ggayane.github.io/css-experiments/cards/dark_rider-character.webp" class="character" />
        </div>
    </a>

    <a href="https://www.mythrillfiction.com/force-mage" target="_blank">
        <div class="card">
            <div class="wrapper">
                <img src="https://ggayane.github.io/css-experiments/cards/force_mage-cover.jpg" class="cover-image" />
            </div>
            <img src="https://ggayane.github.io/css-experiments/cards/force_mage-title.png" class="title" />
            <img src="https://ggayane.github.io/css-experiments/cards/force_mage-character.webp" class="character" />
        </div>
    </a>
</div>

<script>
    function getWeather() {
      const city = document.getElementById("cityInput").value;
      fetch(`/user/mapp?city=${city}`)
        .then(res => res.text())
        .then(data => {
          document.getElementById("result").innerText = data;
        })
        .catch(err => console.error(err));
    }
</script>
</body>
</html>
